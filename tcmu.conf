# Master TCMU configuration file

# Logging Controls
# There are 6 logging levels supported:
#    0: CRIT
#    1: ERROR
#    2: WARNING
#    3: INFO
#    4: DEBUG
#    5: DEBUG SCSI CMD
# And the default logging level is 3, if you want to change the
# default level, uncomment it and set your level number:
# log_level = 3
#
# Logging Directory Path
# The default logging Directory path is /var/log, uncomment it
# and set your own path:
# log_dir = "/var/log"
#
# Metrics
# tcmu-runner can export Prometheus metrics to a file read by the
# node_exporter textfile collector, see docs/monitoring.md. The export
# is disabled by default. To enable it, uncomment metrics_file and set
# it to a *.prom file in the collector directory:
# metrics_file = "/var/lib/node_exporter/textfile_collector/tcmu_runner.prom"
#
# Seconds between two exports, 15 by default:
# metrics_interval = 15
#
# Both settings are read at startup only: restart tcmu-runner after
# changing them.
