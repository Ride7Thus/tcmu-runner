name: RPM Build for Multiple Distributions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build-rpms:
    name: ${{ matrix.distribution }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        distribution: [rocky-8, rocky-9, rocky-10, alma-8, alma-9, alma-10, centos-stream-9, centos-stream-10]
        # "full" builds every handler, the others build without one feature.
        variant: [full, rbd, glfs, qcow, zbc, fbo, tcmalloc]
        include:
          - distribution: rocky-8
            image: rockylinux:8
          - distribution: rocky-9
            image: rockylinux:9
          - distribution: rocky-10
            image: rockylinux:10
          - distribution: alma-8
            image: almalinux:8
          - distribution: alma-9
            image: almalinux:9
          - distribution: alma-10
            image: almalinux:10
          # centos:streamN images are not published on Docker Hub.
          - distribution: centos-stream-9
            image: quay.io/centos/centos:stream9
          - distribution: centos-stream-10
            image: quay.io/centos/centos:stream10

    steps:
      # git must be present before checkout, otherwise actions/checkout
      # downloads a tarball without .git and make_runnerrpms.sh refuses
      # to run.
      - name: Install git
        run: dnf install -y git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history for the commit count in the package version.
          fetch-depth: 0

      # Shared with .gitlab-ci.yml.
      - name: Install dependencies
        run: extra/ci_install_deps.sh

      - name: Build RPMs
        run: extra/ci_build_rpms.sh ${{ matrix.variant }}

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distribution }}-${{ matrix.variant }}
          path: |
            extra/rpmbuild/RPMS/**/*.rpm
            extra/rpmbuild/SRPMS/**/*.rpm
          if-no-files-found: error
