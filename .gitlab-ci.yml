stages:
  - build

variables:
  # Common variables for all jobs
  GIT_SUBMODULE_STRATEGY: recursive

build-rpms:
  stage: build
  image: ${CI_REGISTRY_IMAGE}:${DISTRO_VERSION}
  services:
    - docker:dind
  before_script:
    - echo "Building RPMs for $DISTRO_NAME version $DISTRO_VERSION"
    - |
      if [ "$DISTRO_NAME" = "rocky" ] || [ "$DISTRO_NAME" = "alma" ] || [ "$DISTRO_NAME" = "centos-stream" ]; then
        dnf install -y rpm-build rpmdevtools cmake make gcc libnl3-devel glib2-devel zlib-devel kmod-devel gperftools-devel
        if [ "$DISTRO_VERSION" = "8" ]; then
          dnf install -y centos-release-scl
        fi
      else
        echo "Unsupported distribution: $DISTRO_NAME"
        exit 1
      fi

  script:
    - cd extra
    - chmod +x make_runnerrpms.sh
    - ./make_runnerrpms.sh
    
  artifacts:
    paths:
      - extra/rpmbuild/RPMS/**/*.rpm
      - extra/rpmbuild/SRPMS/**/*.rpm
    expire_in: 1 week

build-rpms-without-features:
  stage: build
  image: ${CI_REGISTRY_IMAGE}:${DISTRO_VERSION}
  services:
    - docker:dind
  before_script:
    - echo "Building RPMs for $DISTRO_NAME version $DISTRO_VERSION without feature $FEATURE"
    - |
      if [ "$DISTRO_NAME" = "rocky" ] || [ "$DISTRO_NAME" = "alma" ] || [ "$DISTRO_NAME" = "centos-stream" ]; then
        dnf install -y rpm-build rpmdevtools cmake make gcc libnl3-devel glib2-devel zlib-devel kmod-devel gperftools-devel
        if [ "$DISTRO_VERSION" = "8" ]; then
          dnf install -y centos-release-scl
        fi
      else
        echo "Unsupported distribution: $DISTRO_NAME"
        exit 1
      fi

  script:
    - cd extra
    - chmod +x make_runnerrpms.sh
    - ./make_runnerrpms.sh --without $FEATURE
    
  artifacts:
    paths:
      - extra/rpmbuild/RPMS/**/*.rpm
      - extra/rpmbuild/SRPMS/**/*.rpm
    expire_in: 1 week

# Matrix for all distributions and features
include:
  - variable:
      DISTRO_NAME: "rocky"
      DISTRO_VERSION: "8"
    job:
      name: "Build RPMs for Rocky Linux 8"
      stage: build
      only:
        - main
        - master
      tags:
        - docker

  - variable:
      DISTRO_NAME: "rocky"
      DISTRO_VERSION: "9"
    job:
      name: "Build RPMs for Rocky Linux 9"
      stage: build
