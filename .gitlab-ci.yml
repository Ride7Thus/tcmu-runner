# Build tcmu-runner RPMs for EL8, EL9 and EL10.
#
# Requires runners with the "common" tag and the Docker (or Kubernetes)
# executor. The RPMs are kept as job artifacts:
#   Build > Pipelines > <pipeline> > <job> > Download artifacts
#
# Every pipeline builds all handlers on every distribution ("full").
# To also build each package without one of the features, run a pipeline
# with the variable BUILD_VARIANTS=1 (Build > Pipelines > Run pipeline),
# or set it in a pipeline schedule.

workflow:
  rules:
    # Avoid duplicate branch and merge request pipelines.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build

default:
  tags:
    - common
  interruptible: true

variables:
  # Full history and tags: the package version comes from git describe,
  # or from the commit count when there are no release tags.
  GIT_DEPTH: "0"

.rpm:
  stage: build
  image: $IMAGE
  script:
    - extra/ci_install_deps.sh
    - extra/ci_build_rpms.sh "$VARIANT"
  artifacts:
    name: "tcmu-runner-$DISTRO-$VARIANT-$CI_COMMIT_REF_SLUG"
    paths:
      - extra/rpmbuild/RPMS/
      - extra/rpmbuild/SRPMS/
    expire_in: 30 days

# centos:streamN images are not published on Docker Hub, use quay.io.
rpm:
  extends: .rpm
  variables:
    VARIANT: full
  parallel:
    matrix:
      - { DISTRO: rocky-8, IMAGE: "rockylinux:8" }
      - { DISTRO: rocky-9, IMAGE: "rockylinux:9" }
      - { DISTRO: rocky-10, IMAGE: "rockylinux:10" }
      - { DISTRO: alma-8, IMAGE: "almalinux:8" }
      - { DISTRO: alma-9, IMAGE: "almalinux:9" }
      - { DISTRO: alma-10, IMAGE: "almalinux:10" }
      - { DISTRO: centos-stream-9, IMAGE: "quay.io/centos/centos:stream9" }
      - { DISTRO: centos-stream-10, IMAGE: "quay.io/centos/centos:stream10" }

rpm-without:
  extends: .rpm
  rules:
    - if: $BUILD_VARIANTS == "1"
  parallel:
    matrix:
      - { DISTRO: rocky-8, IMAGE: "rockylinux:8", VARIANT: [rbd, glfs, qcow, zbc, fbo, tcmalloc] }
      - { DISTRO: rocky-9, IMAGE: "rockylinux:9", VARIANT: [rbd, glfs, qcow, zbc, fbo, tcmalloc] }
      - { DISTRO: rocky-10, IMAGE: "rockylinux:10", VARIANT: [rbd, glfs, qcow, zbc, fbo, tcmalloc] }
      - { DISTRO: alma-8, IMAGE: "almalinux:8", VARIANT: [rbd, glfs, qcow, zbc, fbo, tcmalloc] }
      - { DISTRO: alma-9, IMAGE: "almalinux:9", VARIANT: [rbd, glfs, qcow, zbc, fbo, tcmalloc] }
      - { DISTRO: alma-10, IMAGE: "almalinux:10", VARIANT: [rbd, glfs, qcow, zbc, fbo, tcmalloc] }
      - { DISTRO: centos-stream-9, IMAGE: "quay.io/centos/centos:stream9", VARIANT: [rbd, glfs, qcow, zbc, fbo, tcmalloc] }
      - { DISTRO: centos-stream-10, IMAGE: "quay.io/centos/centos:stream10", VARIANT: [rbd, glfs, qcow, zbc, fbo, tcmalloc] }
